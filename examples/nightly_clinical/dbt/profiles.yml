tablespec_ingest:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST', 'example.databricks.net') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/none') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN', 'compile-only') }}"
      catalog: "{{ env_var('DBT_DATABRICKS_CATALOG', 'dev') }}"
      schema: "{{ env_var('DBT_DATABRICKS_SCHEMA', 'default') }}"
      threads: 1
