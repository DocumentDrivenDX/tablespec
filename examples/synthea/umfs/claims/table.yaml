canonical_name: claims
description: Insurance claims. The densest lineage node — links 
  patients, providers, payers, and encounters.
primary_key:
  - Id
relationships:
  foreign_keys:
    - column: PATIENTID
      cross_pipeline: false
      references_column: Id
      references_table: patients
      type: foreign_key
    - column: PROVIDERID
      cross_pipeline: false
      references_column: Id
      references_table: providers
      type: foreign_key
    - column: PRIMARYPATIENTINSURANCEID
      cross_pipeline: false
      references_column: Id
      references_table: payers
      type: foreign_key
    - column: APPOINTMENTID
      cross_pipeline: false
      references_column: Id
      references_table: encounters
      type: foreign_key
table_name: claims
table_type: ingested
version: '1.0'
