# Project-local HELIX graph contract for tablespec.
#
# This file makes the graph required by .helix.yml concrete in the repository.
# It intentionally mirrors the HELIX library type catalog for the product flow
# while keeping only the relationship edges tablespec relies on for authoring
# order and review.
version: 1
methodology:
  id: helix
  library_version: ^1.0.0
  validator_contract: 1
  root: docs/helix/

activities:
  - id: 00-discover
  - id: 01-frame
  - id: 02-design
  - id: 03-test
  - id: 04-build
  - id: 05-deploy
  - id: 06-iterate

