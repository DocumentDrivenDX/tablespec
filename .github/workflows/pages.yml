# Microsite: build + link-check on website PRs; deploy when a release is published (or on dispatch).
name: pages
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths: ['website/**', 'tests/website/**', '.github/workflows/pages.yml']
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Hugo enableGitInfo
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: website/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.160.0'
          extended: true
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - name: Build (version stamp from the release tag)
        working-directory: website
        env:
          HUGO_PARAMS_VERSION: ${{ github.event.release.tag_name || 'main' }}
        run: |
          npm ci
          hugo --gc --minify
      - name: Link crawl and content checks under /tablespec/
        working-directory: website
        run: |
          npm run install:browsers:ci
          npm run test:links
        env:
          CI: true
      - run: uv run --no-project --with pytest pytest tests/website -q
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
