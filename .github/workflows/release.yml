name: release
# Tag-driven release: test, build, smoke-install, integrate with latest umf-core, publish to PyPI
# (trusted publishing, environment "pypi"), create the GitHub Release.
# workflow_dispatch is a dry run: it builds and smoke-tests the branch and never publishes.
name: release
on:
  push:
    branches: [reset/phase2]  # TEMPORARY dry-run trigger, removed before merge
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Check distributions and version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          uvx twine check dist/*
          test "$(stat -c%s dist/*.tar.gz)" -lt 5000000
          if [ "$REF_TYPE" = tag ]; then
            VERSION="${TAG#v}"
            test -f "dist/umf_tablespec-$VERSION-py3-none-any.whl"
            test -f "dist/umf_tablespec-$VERSION.tar.gz"
            # Claude Code only refreshes an installed plugin when plugin.json's version changes.
            python3 - "$VERSION" <<'PY'
          import json, sys
          expected = sys.argv[1]
          checks = {
              ".claude-plugin/plugin.json": lambda m: m["version"],
              ".codex-plugin/plugin.json": lambda m: m["version"],
              ".claude-plugin/marketplace.json": lambda m: next(p["version"] for p in m["plugins"] if p["name"] == "tablespec"),
          }
          bad = [f"{path}: {get(json.load(open(path)))!r} != {expected!r}" for path, get in checks.items()
                 if get(json.load(open(path))) != expected]
          if bad:
              sys.exit("\n".join(bad))
          print("plugin manifests match", expected)
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Fresh venv install of the built wheel, then the README quickstart
        run: |
          uv venv "$RUNNER_TEMP/v" --python 3.12
          uv pip install --python "$RUNNER_TEMP/v/bin/python" dist/*.whl
          export PATH="$RUNNER_TEMP/v/bin:$PATH"
          tablespec --help > /dev/null
          python -c "import tablespec, tablespec.cli"
          python3 .github/run_quickstart.py README.md
  integration:
    # Latest released umf-core within the supported range.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --group dev
      - run: uv pip install --upgrade "umf-core>=0.10.0,<0.11"
      - run: >-
          uv run --no-sync pytest -n auto --dist loadfile -p no:cacheprovider --timeout=300
          tests/unit/test_shared_umf.py tests/conformance tests/golden tests/test_core_encapsulation.py -q
  publish:
    if: github.ref_type == 'tag'
    needs: [smoke, integration]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
  github-release:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/umf_tablespec-*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$TAG" dist/* --title "$TAG" "${notes[@]}"
