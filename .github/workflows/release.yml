name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version calculation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Verify build
        run: |
          ls -lh dist/
          echo "Built packages:"
          ls -1 dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract release notes
        id: release_notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Create release notes
          cat > release_notes.md << EOF
          ## tablespec $TAG

          ### Installation

          \`\`\`bash
          # From GitHub Pages index
          pip install tablespec==${TAG#v} --index-url https://easel.github.io/tablespec/simple/

          # With PySpark support
          pip install tablespec[spark]==${TAG#v} --index-url https://easel.github.io/tablespec/simple/
          \`\`\`

          ### What's Changed

          See the [commit history](https://github.com/easel/tablespec/commits/$TAG) for details.

          ### Artifacts

          - Source distribution (sdist): \`tablespec-${TAG#v}.tar.gz\`
          - Wheel distribution: \`tablespec-${TAG#v}-py3-none-any.whl\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.release_notes.outputs.tag, 'rc') || contains(steps.release_notes.outputs.tag, 'alpha') || contains(steps.release_notes.outputs.tag, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-index:
    name: Build Microsite and PyPI Index for GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required by Hugo enableGitInfo.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: website/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.160.0'
          extended: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Build Hugo microsite
        working-directory: website
        run: |
          npm ci
          hugo --gc --minify

      - name: Generate combined Pages artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          python scripts/build_pages_artifact.py \
            --site-dir website/public \
            --dist-dir dist \
            --out-dir pages \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --include-github-releases

      - name: Inspect Pages artifact
        run: |
          test -f pages/index.html
          test -f pages/simple/index.html
          test -f pages/simple/tablespec/index.html
          echo "Generated Pages artifact:"
          find pages -maxdepth 3 -type f -print | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-index
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify Release
    needs: [release, deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wait for GitHub Pages propagation
        run: sleep 60

      - name: Verify GitHub Pages installation
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}

          # Try installing from GitHub Pages index
          pip install --index-url https://easel.github.io/tablespec/simple/ tablespec==$VERSION || echo "GitHub Pages index not yet available"

      - name: Summary
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          cat << EOF
          ✅ Release $TAG complete!

          📄 GitHub Pages: https://easel.github.io/tablespec/
          🏷️  GitHub Release: https://github.com/easel/tablespec/releases/tag/$TAG
          EOF
