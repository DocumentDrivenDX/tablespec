name: Installed core consumer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/ldp/**'
      - 'tests/unit/test_shared_umf.py'
      - 'tests/unit/test_current_ontology_snapshots.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/core-consumer.yml'

permissions:
  contents: read
concurrency:
  group: core-consumer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: astral-sh/setup-uv@v5
      - name: Build the candidate archives once
        run: |
          export UV_DYNAMIC_VERSIONING_BYPASS="$(python -c 'import json; print(json.load(open(".codex-plugin/plugin.json"))["version"])')"
          uv build
      - name: Install the candidate with the public binary core
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/python" -m pip --isolated install --index-url https://pypi.org/simple \
            --only-binary=umf-core "$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)[duckdb]" pytest==8.4.2
          "$RUNNER_TEMP/consumer/bin/python" -m pip check
      - name: Prove imports use installed distributions
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/consumer/bin/python" -I - <<'PY'
          import importlib.metadata, pathlib, sysconfig, umf, tablespec
          installed = pathlib.Path(sysconfig.get_path('purelib'))
          assert pathlib.Path(umf.__file__).is_relative_to(installed)
          assert pathlib.Path(tablespec.__file__).is_relative_to(installed)
          core = importlib.metadata.distribution('umf-core')
          assert core.read_text('direct_url.json') is None
          print('Installed public core:', core.version, 'Tablespec:', importlib.metadata.version('umf-tablespec'))
          PY
      - name: Verify shared models, ontology snapshots and portable LDP behavior
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/consumer/bin/python" -m pytest \
            "$GITHUB_WORKSPACE/tests/unit/test_shared_umf.py" \
            "$GITHUB_WORKSPACE/tests/unit/test_current_ontology_snapshots.py" \
            "$GITHUB_WORKSPACE/tests/ldp" \
            -o "pythonpath=$GITHUB_WORKSPACE" -o addopts= -ra \
            --junitxml="$GITHUB_WORKSPACE/dist/consumer-tests.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-core-consumer
          path: dist/*
          if-no-files-found: error
          retention-days: 30
