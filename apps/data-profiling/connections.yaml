# Connections the app can read from.
#
# POC topology: single `dev` catalog. Environments are distinguished by
# schema name prefix (e.g. test_main_sales, prod_main_sales). All reads and
# writes go to this one catalog. No Delta Sharing required.
#
# When the project moves to a multi-catalog workspace, split this into one
# native connection per catalog and remove the prefix convention.

# Metadata home — where the app's governance tables and run artifacts live.
#
# This is the *registry* tier of the ADR-019 precedence:
#
#     deployment environment  >  this block  >  built-in defaults
#
# Leave it commented out for a deployment that supplies PROFILER_METADATA_* in
# its manifest, which is the recommended shape: the address then travels with
# the deployment instead of with tracked source. Uncomment only for local or
# mock work where setting environment variables is inconvenient.
#
# metadata:
#   catalog: my_catalog
#   schema: my_profiler
#   volume: ab_runs
#   warehouse_id: "<sql-warehouse-id>"

connections:
  - name: "DEV (single catalog POC)"
    type: native
    env_label: DEV
    catalogs: ["dev"]

# Env labels offered in the UI dropdown.
env_labels:
  - PROD
  - STAGE
  - QA
  - TEST
  - DEV
