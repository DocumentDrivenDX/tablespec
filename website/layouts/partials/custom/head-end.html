{{- $description := .Description | default site.Params.description -}}
{{/* Blueprint CSS is light-only; pin theme so system/localStorage dark cannot
     leave near-white card titles on the paper background. */}}
<script>
  (function () {
    try { localStorage.setItem("color-theme", "light"); } catch (e) {}
    document.documentElement.classList.remove("dark");
    document.documentElement.classList.add("light");
  })();
</script>
<meta name="description" content="{{ $description }}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:site_name" content="tablespec">
<meta property="og:title" content="{{ if .IsHome }}tablespec - one UMF, every runtime artifact{{ else }}{{ .Title }} - tablespec{{ end }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta name="twitter:card" content="summary_large_image">
{{- if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "tablespec",
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "Python, Spark, Databricks",
  "description": "tablespec compiles one UMF into SQL, dbt, Lakeflow, schema, and validation artifacts for raw, ingested, silver, and gold tables, with a source-semantic ingested bronze contract as the first milestone.",
  "url": "{{ .Permalink }}",
  "codeRepository": "https://github.com/DocumentDrivenDX/tablespec",
  "programmingLanguage": "Python",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What does tablespec define?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "tablespec defines table contracts in UMF: types, validation criteria, relationships, aliases, keys, and derivations. The ingested bronze contract is source-semantic; silver and gold specs declare business decisions. All compile to runtime artifacts."
      }
    },
    {
      "@type": "Question",
      "name": "Does tablespec stop at bronze?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Ingested bronze is the layer tablespec covers most completely. Cross-source conformance, survivorship, and derived gold tables are declared in the same UMF format and compiled by the same step, not hidden inside ingestion."
      }
    }
  ]
}
</script>
{{- end }}
