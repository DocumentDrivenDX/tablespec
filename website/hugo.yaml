baseURL: https://documentdrivendx.github.io/tablespec/
locale: en-us
title: tablespec

module:
  imports:
    - path: github.com/imfing/hextra

enableRobotsTXT: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Getting Started
      pageRef: /getting-started
      weight: 1
    - name: Worked Example
      pageRef: /worked-example
      weight: 2
    - name: Concepts
      pageRef: /concepts
      weight: 3
    - name: CLI Reference
      pageRef: /cli-reference
      weight: 4
    - name: API Reference
      pageRef: /api-reference
      weight: 5
    - name: Demos
      pageRef: /demos
      weight: 6
    - name: GitHub
      url: https://github.com/DocumentDrivenDX/tablespec
      weight: 10
      params:
        icon: github

params:
  description: A UMF compiler that defines the source-semantic ingested bronze contract for data platform teams.

  # Blueprint CSS is light-only (paper grid + ink). Do not follow system dark mode —
  # Hextra's dark text classes make card titles near-white on the forced light paper.
  theme:
    default: light
    displayToggle: false

  navbar:
    displayTitle: true
    displayLogo: false

  page:
    width: wide

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
