  # --------------------------------------------------------------------------
  # NEW gold-derivation cases (executed via generate_sql_plan on BOTH backends).
  # The golden is the SparkDirect oracle output for the gold model. The orphan-FK
  # negative for gold_fk_integrity is a dbt relationships schema-test assertion,
  # not a canonical-row comparison (see acceptance doc Section 4.3 #10).
  #
  # These cases are DECLARED in the corpus now (id, generator path, source UMFs +
  # CSVs committed under their dir) so the taxonomy and the SQLPlanGeneratorGold
  # contract are pinned. They are marked ``pending: true``: their canonical
  # goldens are produced by the executed-gold phase (running the generated gold
  # SQL on BOTH the Spark session AND DuckDB via the dbt-generated gold project,
  # per acceptance doc Section 5.C). Phase 2 does NOT fabricate a golden it cannot
  # yet execute -- the corpus-validation test asserts each pending gold dir holds
  # its source fixtures, and the registry exposes ``pending`` so the executed-gold
  # runner picks them up and writes the golden under ``--update-golden``.
  # --------------------------------------------------------------------------
  - id: gold_join
    kind: gold
    # PROMOTED (was pending): the sequential direct-join (claims x member) path
    # executes byte-stably on BOTH backends. The claims batch carries an ORPHAN
    # claim (member_id=9 with no member row) so the LEFT-join semantics are
    # non-vacuous: row 104 survives with a NULL member_name on both engines, which
    # the committed golden pins. The INNER + join_filter contrast lives in the
    # sibling ``gold_inner_join_filter`` case (one golden per case -- the matrix
    # derives exactly one golden per case id, so LEFT and INNER cannot share one).
    golden: tests/golden/ingest_parity/gold_join.spark.expected.json
    dir: tests/conformance/corpus/gold/gold_join
    generator: _generate_join_step
    ts_precision: 0
    tags: [gold]

  - id: gold_inner_join_filter
    kind: gold
    # INNER-join + join_filter variant of the direct-join path (sibling of
    # gold_join). Exercises _generate_direct_join(join_type=inner) AND
    # _rewrite_join_filter. join_type=inner DROPS the orphan claim (member_id=9)
    # and the filter (plan_type='PPO') drops the HMO member's claim -- so the
    # output (claims 100,102,103) differs observably from the LEFT base case,
    # proving both branches are non-vacuous on both backends.
    #
    # FIXED (real generator bug surfaced by promotion): the join_filter
    # ``plan_type = 'PPO' AND UPPER(region) <> 'no region here'`` contains the
    # column token ``region`` INSIDE the string literal ``'no region here'``.
    # _rewrite_join_filter previously re.sub'd column tokens over the RAW filter
    # string and rewrote the in-literal token, emitting the corrupted constant
    # ``'no target.region here'`` on BOTH backends (a correctness bug, not a
    # dialect divergence). The rewriter is now quote-span-aware: it only qualifies
    # tokens in CODE spans and preserves single-quoted literals (incl. ``''``
    # escapes) verbatim, so the bare ``plan_type``/``region`` are qualified while
    # the literal is untouched, identically on duckdb + spark.
    golden: tests/golden/ingest_parity/gold_inner_join_filter.spark.expected.json
    dir: tests/conformance/corpus/gold/gold_inner_join_filter
    generator: _generate_join_step
    ts_precision: 0
    tags: [gold]

  - id: gold_pivot
    kind: gold
    # FIXED (was a KNOWN DIVERGENCE): the generator previously (a) joined the pivot
    # CTE under the alias `pivot`, a RESERVED word in DuckDB (parse error; Spark
    # accepts it) and (b) mapped the final-assembly columns to diagnosis__Code
    # instead of the pivoted diagnosis__diagnosis_1..3 the pivot CTE emits. The
    # generator now aliases the join `pivoted` and maps each target column to its
    # pivoted output, so the case executes byte-stably on BOTH backends and the
    # committed golden (the Spark-backend oracle output) is enforced.
    golden: tests/golden/ingest_parity/gold_pivot.spark.expected.json
    dir: tests/conformance/corpus/gold/gold_pivot
    generator: _generate_pivot_join
    ts_precision: 0
    tags: [gold]

  - id: gold_unpivot
    kind: gold
    # PROMOTED (was pending): the UNPIVOT base-view path executes byte-stably on
    # BOTH backends. ``UNPIVOT EXCLUDE NULLS (score FOR source_column IN (q1,q2,q3))``
    # is accepted verbatim by DuckDB AND Spark and both EXCLUDE the NULL q2 cell for
    # M2 (no row emitted), so the committed Spark-oracle golden -- (M1,q1,10),
    # (M1,q2,20),(M1,q3,30),(M2,q1,5),(M2,q3,15) -- is enforced identically on both.
    # The dedup-latest branch contrast lives in the sibling ``gold_unpivot_dedup``
    # case (one golden per case; the no-dedup and dedup-latest branches cannot share
    # one golden).
    golden: tests/golden/ingest_parity/gold_unpivot.spark.expected.json
    dir: tests/conformance/corpus/gold/gold_unpivot
    generator: _generate_unpivot_base_view
    ts_precision: 0
    tags: [gold]

  - id: gold_unpivot_dedup
    kind: gold
    # dedup-latest variant of the UNPIVOT path (sibling of gold_unpivot). Exercises
    # the ``dedup_strategy == "latest"`` branch of _generate_unpivot_base_view: the
    # wide source carries TWO snapshots per member (distinct meta_load_dt) and NO
    # primary_key, so the staging model blind-appends both; the gold model keeps the
    # LATEST snapshot per member and unpivots ALL its quarters.
    #
    # FIXED (real generator correctness bug surfaced by promotion): the dedup branch
    # previously UNPIVOTed FIRST and then ranked ``PARTITION BY <pk>`` -- so
    # ``WHERE rn = 1`` kept exactly ONE unpivoted row per member, collapsing q1/q2/q3
    # to a single arbitrary quarter (M1 => only (q1,100)) on BOTH backends. The branch
    # now dedups the WIDE row first (rank the snapshots, keep the latest, THEN unpivot)
    # so every quarter of the winning snapshot survives: M1 (latest 2024-02-01) =>
    # (q1,100),(q2,200),(q3,300); M2 => (q1,5),(q3,15); M3 (latest 2024-04-01) =>
    # (q1,7),(q3,9) -- q2 NULLs excluded. It also lists the deduped columns explicitly
    # instead of ``SELECT * EXCEPT (rn)`` (the dialect-portable form: DuckDB EXCLUDE vs
    # Spark EXCEPT), so the model runs byte-stably on both backends.
    golden: tests/golden/ingest_parity/gold_unpivot_dedup.spark.expected.json
    dir: tests/conformance/corpus/gold/gold_unpivot_dedup
    generator: _generate_unpivot_base_view
    ts_precision: 0
    tags: [gold]

  - id: gold_window_aggregation
    kind: gold
    # FIXED (was a KNOWN DIVERGENCE): with base_table_strategy=union_sources over
    # (member, claims) the generator built the universe by UNION-ing
    # member.member_id with claims.claim_id (it picked each table's own primary
    # key, treating claim_id as a member_id), so the per-member pre-aggregations
    # joined on the wrong key. The resolver now unions a CONSISTENT key -- the
    # column in each source that matches the target PK (member_id), so claims
    # contributes its member_id FK, not claim_id. Two further generator fixes were
    # needed for this shape to execute byte-stably on both backends: the window
    # aggregation view now PROJECTS its order_by column (service_date) into the
    # ranked CTE so the window ORDER BY resolves, and the GROUP BY pre-aggregation
    # view gets a distinct name (claims_agg_grouped) so it no longer clobbers the
    # window view (claims_agg). The order_by entry stays a BARE column so the
    # rendered window is ``ORDER BY service_date DESC`` (no ``DESC DESC``).
    golden: tests/golden/ingest_parity/gold_window_aggregation.spark.expected.json
    dir: tests/conformance/corpus/gold/gold_window_aggregation
    generator: _generate_pre_aggregation_views
    ts_precision: 0
    tags: [gold]

  - id: gold_survivorship_priority
    kind: gold
    # FIXED (was a KNOWN DIVERGENCE): the generated gold model appeared to stop at
    # the per-source join CTEs (system_a__phone, system_b__phone_number) and never
    # produce the declared `phone` survivorship column (column-not-found on duckdb;
    # all-NULL on spark). Root cause was a CTE-name collision: the union base view
    # AND the final-assembly view were BOTH named after the target table
    # (member_universe), and the views->CTE conversion dedups CTE names, so the
    # SECOND (the final assembly carrying the priority-COALESCE) was dropped and the
    # model ended at the last join step. The union base view is now named
    # ``union_universe`` (distinct from any target table), so the final assembly is
    # the terminal CTE and the priority-sorted COALESCE(system_a.phone,
    # system_b.phone_number) `phone` column is produced identically on both
    # backends.
    golden: tests/golden/ingest_parity/gold_survivorship_priority.spark.expected.json
    dir: tests/conformance/corpus/gold/gold_survivorship_priority
    generator: _generate_member_universe_view
    ts_precision: 0
    tags: [gold]

  - id: gold_survivorship_max_across_sources
    kind: gold
    # PROMOTED (executed on duckdb + spark). The max_across_sources survivorship
    # branch: the member universe is the UNION of system_a + system_b keyed by
    # member_id, and the surviving ``score`` is
    # ``COALESCE(GREATEST(system_a.score, system_b.score_b), -1)`` -- the GREATEST
    # branch of _generate_greatest_mapping (sql_generator.py ~1840/1974) plus the
    # COALESCE(...,default_value) fallback. Sibling of gold_survivorship_priority
    # (which exercises the priority-COALESCE branch); one golden per case, so the
    # GREATEST contrast lives in its own case.
    #
    # The GREATEST/default contract is made OBSERVABLE and NON-VACUOUS on BOTH
    # backends by the corpus:
    #   * M1 (a=10, b=20)     -> GREATEST(10,20)=20                 (plain max)
    #   * M2 (a=NULL, b=5)    -> COALESCE(GREATEST(NULL,5),-1)=5    (one candidate
    #       NULL + a real value + default => the real max wins over the default,
    #       proving COALESCE keeps GREATEST's non-null result, NOT the default)
    #   * M3 (a=7, no b row)  -> GREATEST(7)=7                      (member only in A)
    #   * M4 (a=NULL, b=NULL) -> COALESCE(GREATEST(NULL,NULL),-1)=-1 (NULL in BOTH
    #       sources + default => the bare DEFAULT literal wins, proving the COALESCE
    #       default-fallback branch)
    # GREATEST is a high cross-backend divergence risk (NULL handling + numeric type
    # coercion differ between DuckDB and Spark in general). VERIFIED on both: each
    # backend's GREATEST SKIPS NULL args (GREATEST(10,NULL)=10) and returns NULL only
    # when ALL args are NULL, so COALESCE(...,-1) yields -1 ONLY for M4 -- identically
    # on duckdb + spark. The matrix pins the Spark-oracle golden and asserts DuckDB
    # agrees byte-for-byte.
    golden: tests/golden/ingest_parity/gold_survivorship_max_across_sources.spark.expected.json
    dir: tests/conformance/corpus/gold/gold_survivorship_max_across_sources
    generator: _generate_member_universe_view
    ts_precision: 0
    tags: [gold]

  - id: gold_first_record
    kind: gold
    # PROMOTED (was pending): the first-record-per-key path
    # (_generate_first_record_join: ROW_NUMBER PARTITION BY key, keep rn=1)
    # executes byte-stably on BOTH backends and matches the committed Spark-oracle
    # golden -- parent 1 => detail_value 'alpha', parent 2 => 'gamma'.
    #
    # FIXED (real determinism bug surfaced by promotion): the generator's ORDER BY
    # was the bare heuristic discriminator column (here record_type, the column
    # whose name contains "type") with NO tiebreak, so the ROW_NUMBER ranking was
    # NOT a total order -- two rows of a parent that tie on record_type left "first"
    # undefined and DuckDB vs Spark could pick different rows (a non-deterministic
    # cross-backend divergence, not a dialect issue). The corpus deliberately gives
    # parent 1 TWO rows tied on record_type='A' but with DIFFERENT surfaced
    # detail_value ('zeta' and 'alpha'), so the tie is real AND observable in the
    # output. The generator now appends a STABLE TIEBREAK (the partition key
    # followed by every remaining target column in declared order, each emitted as
    # ``col ASC NULLS LAST`` -- explicit because DuckDB defaults ASC NULLS LAST while
    # Spark defaults NULLS FIRST, so the placement is pinned dialect-identically),
    # making the rank a total order: among the tied A-rows detail_value breaks the
    # tie and 'alpha' < 'zeta' deterministically wins on both backends. parent 2
    # ('gamma') is the single-row control.
    #
    # CORPUS FIX: detail.umf no longer declares parent_id as a single-column PK
    # (parent_id is a 1:N FOREIGN key). The PK declaration made the ingest staging
    # model dedup to ONE row per parent and collapse the N detail rows BEFORE the
    # first-record ranking -- defeating the case (the ranking must see all N rows).
    golden: tests/golden/ingest_parity/gold_first_record.spark.expected.json
    dir: tests/conformance/corpus/gold/gold_first_record
    generator: _generate_first_record_join
    ts_precision: 0
    tags: [gold]

  - id: gold_fk_integrity
    kind: gold
    # PROMOTED (was pending): orphan-FK referential integrity is NOT a
    # canonical-row comparison -- generate_sql_plan uses FK metadata only for join
    # planning and never emits an orphan check, so this case pins NO row golden and
    # the row-parity matrix SKIPS it with an explicit reason (never silently green).
    # It is instead EXECUTED at the dbt ``relationships`` schema-test tier
    # (test_fk_orphan_enforcement.py): generate_dbt_project emits the
    # ``relationships`` test for claims.member_id -> member.member_id (plus the
    # referenced member model so the ref resolves), and ``dbt build`` is asserted --
    # via the relationships node's status + failures in run_results.json -- to PASS
    # on claims.clean.csv and FAIL (exactly one orphan) on claims.orphan.csv. That
    # runs on BOTH backends: DuckDB (full PK + NOT-NULL contract, CLI dbt) AND the
    # local Delta Spark session (in-process dbtRunner).
    #
    # FIXED (real dbt-emitter bug surfaced by promotion): an incremental ``merge``
    # model emitted no file_format, so dbt-spark REJECTED the merge strategy
    # (parquet default) and SKIPPED every downstream test incl. the FK test. The
    # spark/databricks dialects now pin file_format='delta' on the merge config
    # (the Databricks runtime these casts target IS Delta); duckdb is unaffected.
    # The spark leg additionally relaxes ONLY the NOT-NULL column contract (a
    # documented local managed-Delta ``ALTER ... SET NOT NULL`` limitation, covered
    # on the real runtime by the dbt-databricks compile + LDP e2e tiers); the FK
    # relationships test -- the unit under test -- is dialect-agnostic and runs
    # unchanged on both backends.
    executed_via: test_fk_orphan_enforcement
    dir: tests/conformance/corpus/gold/gold_fk_integrity
    generator: relationships_schema_test
    ts_precision: 0
    tags: [gold]
