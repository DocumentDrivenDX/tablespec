# Unified conformance corpus manifest (Phase 2).
#
# Each case is a declarative record consumed by tests/conformance/corpus/registry.py.
# A case ties together: the UMF spec, the ordered raw CSV batch(es), the committed
# canonical golden (the SparkDirect oracle output -- "the previous implementation"),
# the timestamp precision the golden was rendered at, and a tag list.
#
# Paths are relative to the repo root.
#
# Tag taxonomy (docs/helix/03-test/conformance-acceptance.md Section 4.2):
#   types     - scalar type coverage (passthrough, numeric, boolean)
#   decimal   - decimal precision / scale / overflow boundaries
#   datetime  - date/timestamp format parsing
#   tz        - timezone-aware + sub-second timestamp behavior
#   incremental - incremental (merge / append) ingestion
#   snapshot  - full-snapshot ingestion
#   pk / nopk - has / lacks a primary key (dedup vs blind-append)
#   multibatch - 3+ batches / out-of-order _load_ts
#   gold      - cross-table gold derivation (join/pivot/unpivot/window/etc)
#
# ts_precision: fractional-second digits the golden is rendered at and every
#   engine leg must canonicalize at. The existing second-resolution ingest corpus
#   pins 0 (its goldens are byte-for-byte unchanged); the new sub-second/tz case
#   uses microsecond (6). See canonical.DEFAULT_TS_PRECISION.

version: 1

# Where ingest fixture files (UMF, CSV, golden) live. Existing fixtures remain
# under tests/fixtures/ingest with goldens under tests/golden/ingest_parity; new
# cases live under this corpus directory.
defaults:
  ts_precision: 0

cases:
