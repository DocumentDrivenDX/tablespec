version: "1.0"
table_name: member_diagnoses
description: >-
  GOLD - pivot the 1:N diagnosis rows into numbered columns diagnosis_1..3 per
  member. The numbered columns derived from the 1:N diagnosis table trigger the
  pivot strategy (_generate_pivot_join).
primary_key:
  - member_id
metadata:
  base_table: member
columns:
  - name: member_id
    data_type: VARCHAR
    nullable:
      default: false
    derivation:
      strategy: primary_key
  - name: diagnosis_1
    data_type: VARCHAR
    nullable:
      default: true
    derivation:
      candidates:
        - table: diagnosis
          column: Code
          priority: 1
      survivorship:
        strategy: single_source
        explanation: First diagnosis
  - name: diagnosis_2
    data_type: VARCHAR
    nullable:
      default: true
    derivation:
      candidates:
        - table: diagnosis
          column: Code
          priority: 1
      survivorship:
        strategy: single_source
        explanation: Second diagnosis
  - name: diagnosis_3
    data_type: VARCHAR
    nullable:
      default: true
    derivation:
      candidates:
        - table: diagnosis
          column: Code
          priority: 1
      survivorship:
        strategy: single_source
        explanation: Third diagnosis
relationships:
  outgoing:
    - target_table: diagnosis
      source_column: member_id
      target_column: member_id
      type: foreign_to_primary
      confidence: 0.9
      cardinality:
        type: one_to_many
        notation: "1:N"
        source_multiplicity: "1"
        target_multiplicity: "*"
