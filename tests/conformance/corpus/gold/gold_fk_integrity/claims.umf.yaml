version: "1.0"
table_name: claims
description: >-
  Claims with a member_id foreign key into member. Drives the dbt relationships
  schema-test (orphan-FK detection) - gold_fk_integrity.
primary_key:
  - claim_id
relationships:
  foreign_keys:
    - column: member_id
      references_table: member
      references_column: member_id
      type: foreign_key
  outgoing:
    - target_table: member
      source_column: member_id
      target_column: member_id
      type: foreign_to_primary
      confidence: 1.0
      cardinality:
        type: many_to_one
        notation: "1:1"
        source_multiplicity: "*"
        target_multiplicity: "1"
columns:
  - name: claim_id
    data_type: INTEGER
    nullable:
      default: false
  - name: member_id
    data_type: INTEGER
    nullable:
      default: true
