version: "1.0"
table_name: inventory_legacy
description: >-
  Legacy inventory snapshot feed (pre-cutover generation). Carries a DATE-typed
  file_date used by the generation-cutover row_filter, a legacy-only fee_amount
  column, and TWO rows for one grain key (distinct meta_load_dt) so the
  per-branch dedup-latest window is exercised. One row's file_date falls ON/AFTER
  the 2026-07-20 cutover and must be dropped by the legacy branch row_filter.
  Source for gold_union_branches.
columns:
  - name: arbit_id
    data_type: VARCHAR
    nullable:
      default: false
  - name: cpt
    data_type: VARCHAR
    nullable:
      default: false
  - name: dos
    data_type: DATE
    format: YYYY-MM-DD
    nullable:
      default: false
  - name: snapshot_date
    data_type: DATE
    format: YYYY-MM-DD
    nullable:
      default: false
  - name: file_date
    data_type: DATE
    format: YYYY-MM-DD
    nullable:
      default: false
  - name: charges
    data_type: INTEGER
    nullable:
      default: true
  - name: fee_amount
    data_type: INTEGER
    nullable:
      default: true
  - name: meta_load_dt
    data_type: DATE
    format: YYYY-MM-DD
    nullable:
      default: false
