version: "1.0"
table_name: member_universe
description: >-
  GOLD - survivorship across union_sources. The member universe is the UNION of
  system_a and system_b keyed by member_id; the surviving phone is the
  priority-sorted COALESCE of the candidates (system_a priority 1, system_b
  priority 2). This is the generator's supported survivorship mechanism
  (_generate_member_universe_view + priority COALESCE), per acceptance Section 4.3
  #8. Most-recent / longest-value survivorship is out of scope (not a named
  generator strategy).
primary_key:
  - member_id
metadata:
  base_table_strategy: union_sources
  source_tables:
    - system_a
    - system_b
columns:
  - name: member_id
    data_type: VARCHAR
    nullable:
      default: false
    derivation:
      strategy: primary_key
  - name: phone
    data_type: VARCHAR
    nullable:
      default: true
    derivation:
      candidates:
        - table: system_a
          column: phone
          priority: 1
        - table: system_b
          column: phone_number
          priority: 2
      survivorship:
        strategy: highest_priority
        explanation: system_a preferred, fallback to system_b
