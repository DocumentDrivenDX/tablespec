version: "1.0"
table_name: claims
description: Healthcare claims (snapshot source for gold_inner_join_filter)
primary_key:
  - claim_id
relationships:
  foreign_keys:
    - column: member_id
      references_table: member
      references_column: member_id
      type: foreign_key
      # INNER join variant: claims with no surviving member row (orphan or
      # filtered-out plan_type) are DROPPED, unlike the LEFT base case.
      join_type: inner
  outgoing:
    - target_table: member
      source_column: member_id
      target_column: member_id
      type: foreign_to_primary
      confidence: 1.0
      cardinality:
        type: many_to_one
        notation: "1:1"
        source_multiplicity: "*"
        target_multiplicity: "1"
columns:
  - name: claim_id
    data_type: INTEGER
    nullable:
      default: false
  - name: member_id
    data_type: INTEGER
    nullable:
      default: true
