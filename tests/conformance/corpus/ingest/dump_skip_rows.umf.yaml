table_name: dump_skip_rows
description: >-
  Skip-rows coverage. Two preamble lines precede the header row and must be
  ignored before parsing starts.
ingestion:
  mode: snapshot
source:
  kind: delimited
  delimiter: ","
  header: true
  skip_rows: 2
columns:
  - name: row_id
    data_type: VARCHAR
    nullable: false
  - name: note
    data_type: VARCHAR
    nullable: true
