table_name: members
description: Member roster snapshot with a declared primary key
primary_key:
  - member_id
ingestion:
  mode: snapshot
  order_by:
    - _load_ts
columns:
  - name: member_id
    data_type: VARCHAR
    nullable: false
  - name: full_name
    data_type: VARCHAR
    nullable: true
  - name: birth_date
    data_type: DATE
    format: YYYYMMDD
    nullable: true
  - name: enrolled
    data_type: BOOLEAN
    nullable: true
  - name: monthly_premium
    data_type: DECIMAL
    precision: 8
    scale: 2
    nullable: true
