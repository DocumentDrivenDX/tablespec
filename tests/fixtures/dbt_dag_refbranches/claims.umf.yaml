version: "1.0"
table_name: claims
description: Claims hub with outgoing relations to a qualified-canonical, an alias, and an external table
primary_key:
  - claim_id
ingestion:
  mode: snapshot
  order_by:
    - _load_ts
columns:
  - name: claim_id
    data_type: INTEGER
    nullable:
      default: false
  - name: member_id
    data_type: INTEGER
    nullable:
      default: true
  - name: provider_id
    data_type: INTEGER
    nullable:
      default: true
  - name: ref_id
    data_type: INTEGER
    nullable:
      default: true
relationships:
  outgoing:
    - target_table: mart.member
      source_column: member_id
      target_column: member_id
      type: foreign_to_primary
      confidence: 1.0
      cardinality:
        type: many_to_one
        notation: "1:1"
        source_multiplicity: "*"
        target_multiplicity: "1"
    - target_table: prov
      source_column: provider_id
      target_column: provider_id
      type: foreign_to_primary
      confidence: 1.0
      cardinality:
        type: many_to_one
        notation: "1:1"
        source_multiplicity: "*"
        target_multiplicity: "1"
    - target_table: extpipe.refs
      source_column: ref_id
      target_column: ref_id
      type: foreign_to_primary
      confidence: 1.0
      cardinality:
        type: many_to_one
        notation: "1:1"
        source_multiplicity: "*"
        target_multiplicity: "1"
