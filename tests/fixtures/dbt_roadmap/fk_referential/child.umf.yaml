version: "1.0"
table_name: child
description: Child table with a nullable FK to parent (incremental landing)
primary_key:
  - child_id
ingestion:
  mode: incremental
  order_by:
    - _load_ts
columns:
  - name: child_id
    data_type: INTEGER
    nullable:
      default: false
  - name: parent_id
    data_type: INTEGER
    nullable:
      default: true
relationships:
  foreign_keys:
    - column: parent_id
      references_table: parent
      references_column: parent_id
      type: foreign_key
  outgoing:
    - target_table: parent
      source_column: parent_id
      target_column: parent_id
      type: foreign_to_primary
      confidence: 1.0
      cardinality:
        type: many_to_one
        notation: "1:1"
        source_multiplicity: "*"
        target_multiplicity: "1"
