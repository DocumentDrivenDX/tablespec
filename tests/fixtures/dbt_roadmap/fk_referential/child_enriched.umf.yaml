version: "1.0"
table_name: child_enriched
description: GOLD - child rows enriched with parent_name; carries the FK to parent
primary_key:
  - child_id
metadata:
  base_table: child
columns:
  - name: child_id
    data_type: INTEGER
    nullable:
      default: false
    derivation:
      strategy: primary_key
  - name: parent_id
    data_type: INTEGER
    nullable:
      default: true
    derivation:
      strategy: base_column
      candidates:
        - table: child
          column: parent_id
          priority: 1
  - name: parent_name
    data_type: VARCHAR
    nullable:
      default: true
    derivation:
      strategy: survivorship
      candidates:
        - table: parent
          column: parent_name
          priority: 1
relationships:
  foreign_keys:
    - column: parent_id
      references_table: parent
      references_column: parent_id
      type: foreign_key
  outgoing:
    - target_table: parent
      source_column: parent_id
      target_column: parent_id
      type: foreign_to_primary
      confidence: 1.0
      cardinality:
        type: many_to_one
        notation: "1:1"
        source_multiplicity: "*"
        target_multiplicity: "1"
