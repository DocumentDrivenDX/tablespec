version: "1.0"
table_name: member
description: Member master (snapshot)
primary_key:
  - member_id
ingestion:
  mode: snapshot
  order_by:
    - _load_ts
columns:
  - name: member_id
    data_type: INTEGER
    nullable:
      default: false
  - name: member_name
    data_type: VARCHAR
    nullable:
      default: true
  - name: state
    data_type: VARCHAR
    nullable:
      default: true
